<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>Mi rutina</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi rutina">
<style>
  :root{
    --bg:#0b0e14; --card:#141922; --card2:#1b212d; --line:#262f3d;
    --fg:#edf0f5; --muted:#8f9bb0; --primary:#6366f1; --accent:#22d3ee; --ok:#22c55e; --danger:#ef4444;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f6fa; --card:#fff; --card2:#eef1f6; --line:#e2e6ee; --fg:#161c26; --muted:#5c6678; --primary:#4f46e5; --accent:#0891b2; }
  }
  :root[data-theme="light"]{ --bg:#f4f6fa; --card:#fff; --card2:#eef1f6; --line:#e2e6ee; --fg:#161c26; --muted:#5c6678; --primary:#4f46e5; --accent:#0891b2; }
  :root[data-theme="dark"]{ --bg:#0b0e14; --card:#141922; --card2:#1b212d; --line:#262f3d; --fg:#edf0f5; --muted:#8f9bb0; --primary:#6366f1; --accent:#22d3ee; }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:1.45}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 130px}
  h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
  .muted{color:var(--muted)}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  button{font-family:inherit}

  header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .iconbtn{background:var(--card2);border:1px solid var(--line);color:var(--fg);border-radius:10px;height:38px;min-width:38px;padding:0 10px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .wk{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--primary);
    background:color-mix(in srgb,var(--primary) 16%,transparent);padding:3px 9px;border-radius:999px;margin-top:6px}

  .overall{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
  .bar{height:9px;background:var(--card2);border-radius:999px;overflow:hidden;margin-top:10px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:999px;transition:width .3s;width:0}

  details.day{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
  details.day[open]{border-color:color-mix(in srgb,var(--primary) 40%,var(--line))}
  summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px}
  summary::-webkit-details-marker{display:none}
  .badge{width:42px;height:42px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;font-weight:800;font-size:17px;
    background:color-mix(in srgb,var(--primary) 16%,transparent);color:var(--primary)}
  .badge.done{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
  .warm .badge{background:color-mix(in srgb,#eab308 16%,transparent);color:#eab308;font-size:20px}
  summary .grow{flex:1;min-width:0}
  summary .ttl{font-weight:700;font-size:15px}
  summary .sub{font-size:12px;margin-top:2px}
  summary .chev{color:var(--muted);transition:transform .2s;font-size:13px}
  details[open] summary .chev{transform:rotate(180deg)}
  .today{font-size:10px;font-weight:800;letter-spacing:.05em;background:color-mix(in srgb,var(--primary) 22%,transparent);color:var(--primary);padding:2px 7px;border-radius:999px}

  .exlist{padding:0 8px 8px}
  .ex{border-top:1px solid var(--line)}
  .ex:first-child{border-top:0}
  .exhead{display:flex;align-items:center;gap:11px;padding:11px 8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .dot{width:24px;height:24px;flex:0 0 auto;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;background:transparent;cursor:pointer;padding:0}
  .ex.done .dot{background:var(--ok);border-color:var(--ok)}
  .ex .nm{flex:1;min-width:0}
  .ex .nm b{font-weight:600;font-size:14.5px;display:block}
  .ex.done .nm b{color:var(--muted);text-decoration:line-through}
  .ex .nm small{color:var(--muted);font-size:11.5px}
  .notehint{display:block;font-size:11.5px;color:var(--accent);margin-top:3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ser{font-size:11px;font-weight:700;font-family:var(--mono);color:var(--muted);background:var(--card2);border:1px solid var(--line);padding:2px 7px;border-radius:999px}
  .exchev{color:var(--muted);font-size:11px;transition:transform .2s}
  .ex.open .exchev{transform:rotate(180deg)}

  .panel{display:none;padding:2px 8px 12px 41px}
  .ex.open .panel{display:block}
  .prev{font-size:11.5px;color:var(--muted);margin-bottom:8px;font-family:var(--mono)}
  .prev b{color:var(--accent);font-weight:700}
  .prevnote{font-size:12.5px;color:var(--fg);background:color-mix(in srgb,var(--accent) 10%,transparent);
    border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));border-radius:10px;padding:8px 10px;margin-bottom:10px;line-height:1.4}
  .prevnote b{color:var(--fg);font-weight:700}
  .setrow{display:grid;grid-template-columns:20px 1fr 1fr 40px;gap:7px;align-items:center;margin-bottom:6px}
  .setrow.chk1{grid-template-columns:20px 1fr 40px}
  .setrow .sn{text-align:center;font-weight:700;color:var(--muted);font-family:var(--mono);font-size:13px}
  .setrow .tgt{font-size:13px;color:var(--muted)}
  .fin{position:relative}
  .fin input{width:100%;height:40px;border:1px solid var(--line);background:var(--card2);color:var(--fg);border-radius:9px;text-align:center;font-weight:700;font-family:var(--mono);font-size:15px;padding-top:7px}
  .fin em{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:8.5px;color:var(--muted);text-transform:uppercase;font-style:normal}
  .tick{height:38px;border-radius:9px;background:var(--card2);color:var(--muted);font-weight:800;font-size:15px;cursor:pointer;border:1px solid var(--line)}
  .setrow.on .tick{background:var(--ok);color:#fff;border-color:var(--ok)}
  .notelbl{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:12px 0 5px}
  .noteinput{width:100%;min-height:54px;border:1px solid var(--line);background:var(--card2);color:var(--fg);border-radius:10px;padding:9px 11px;font-family:inherit;font-size:14px;line-height:1.4;resize:vertical}
  .noteinput:focus-visible,.field:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  /* Edición */
  .edrow{display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid var(--line)}
  .edrow:first-child{border-top:0}
  .edrow .nm{flex:1;min-width:0;font-size:14px}
  .edrow .nm small{display:block;color:var(--muted);font-size:11.5px}
  .minibtn{border:1px solid var(--line);background:var(--card2);color:var(--fg);border-radius:8px;height:34px;min-width:34px;padding:0 9px;font-size:14px;cursor:pointer;font-weight:700}
  .minibtn.del{color:var(--danger)}
  .addbtn{width:100%;border:1px dashed var(--line);background:transparent;color:var(--primary);border-radius:10px;padding:10px;font-weight:700;cursor:pointer;margin-top:4px;font-size:13.5px}
  .edtools{display:flex;gap:10px;margin-bottom:12px}

  .actions{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
  .btn{flex:1;min-width:130px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--fg);font-weight:700;cursor:pointer;font-size:14px}
  .btn.primary{background:var(--primary);color:#fff;border-color:transparent}
  .btn.danger{color:var(--danger)}
  .foot{margin-top:18px;font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:26px 18px;text-align:center}

  .rest{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:50;width:min(528px,calc(100% - 24px));
    background:var(--card);border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);padding:10px 12px;display:none;align-items:center;gap:10px}
  .rest.show{display:flex}
  .rest .t{font-size:26px;font-weight:800;font-family:var(--mono);color:var(--accent);min-width:66px}
  .rest .rb{border:1px solid var(--line);background:var(--card2);color:var(--fg);border-radius:9px;height:34px;padding:0 10px;font-weight:700;cursor:pointer;font-size:13px}
  .rest .rb.x{background:transparent;border:0;color:var(--muted);font-size:18px;padding:0 6px}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:none;align-items:flex-end;justify-content:center;padding:0}
  .overlay.show{display:flex}
  @media(min-width:560px){.overlay{align-items:center;padding:16px}}
  .sheet{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:88vh;overflow:auto;padding:18px}
  @media(min-width:560px){.sheet{border-radius:18px}}
  .sheet h2{margin:0 0 14px;font-size:18px}
  .field{width:100%;height:44px;border:1px solid var(--line);background:var(--card2);color:var(--fg);border-radius:11px;padding:0 12px;font-size:15px;font-family:inherit}
  .flabel{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:12px 0 5px}
  .seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;width:100%}
  .seg button{flex:1;border:0;background:transparent;color:var(--muted);font-weight:700;padding:8px;border-radius:8px;cursor:pointer;font-size:13px}
  .seg button.on{background:var(--primary);color:#fff}
  .profrow{display:flex;align-items:center;gap:10px;padding:11px 6px;border-top:1px solid var(--line);cursor:pointer}
  .profrow:first-child{border-top:0}
  .profrow .av{width:34px;height:34px;border-radius:999px;background:color-mix(in srgb,var(--primary) 20%,transparent);color:var(--primary);display:grid;place-items:center;font-weight:800;flex:0 0 auto}
  .profrow.cur{color:var(--primary)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Mi rutina</h1>
      <p class="muted" style="font-size:13px" id="weeklabel">—</p>
      <span class="wk" id="wknum">Semana 1</span>
    </div>
    <div style="display:flex;gap:8px;align-items:flex-start">
      <button class="iconbtn" id="profbtn">👤 <span id="profname">—</span> ▾</button>
      <button class="iconbtn" id="theme" title="Tema">🌗</button>
    </div>
  </header>

  <div class="overall">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <b style="font-size:16px">Progreso de la semana</b>
      <span class="mono" id="ov-txt" style="font-weight:800">0/0</span>
    </div>
    <div class="bar"><i id="ov-bar"></i></div>
  </div>

  <div class="edtools" id="edtools" style="display:none">
    <button class="btn primary" id="addday">➕ Agregar día</button>
    <button class="btn" id="doneedit">✓ Listo</button>
  </div>

  <div id="days"></div>

  <div class="actions">
    <button class="btn" id="editbtn">✏️ Editar rutina</button>
    <button class="btn" id="reset">↻ Reiniciar semana</button>
  </div>

  <p class="foot">Cada perfil guarda su propia rutina y sus datos en <b>este dispositivo</b>.<br>Compartí el link: tu amigo crea su perfil en su celu y arma su propia rutina.</p>
</div>

<div class="rest" id="rest">
  <span style="font-size:18px">⏱️</span>
  <span class="t" id="rest-t">0:00</span>
  <span class="muted" style="font-size:13px;flex:1">Descanso</span>
  <button class="rb" id="rest-minus">−15</button>
  <button class="rb" id="rest-plus">+15</button>
  <button class="rb x" id="rest-skip">✕</button>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h2 id="modal-title">—</h2>
    <div id="modal-body"></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  function genId(p){ return (p||"id")+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function addDays(iso,n){ var d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
  function weekKey(dt){ var d=dt?new Date(dt):new Date(); var day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return d.toISOString().slice(0,10); }
  var CUR=weekKey(), PREV=addDays(CUR,-7);

  // ---------- rutina por defecto (semilla para cada perfil nuevo) ----------
  // Generador de rutinas de ejemplo: elegís 3/4/5 días y tipo (full body o split).
  function mkE(n,sets,reps,rest){ return {id:genId("ex"),n:n,log:true,sets:sets,reps:reps,rest:rest,tgt:""}; }
  function mkC(n,sets,rest,tgt){ return {id:genId("ex"),n:n,log:false,sets:sets,reps:"",rest:rest,tgt:tgt}; }
  function mkDay(title,wd,ex){ return {id:genId("d"),title:title,weekday:wd,ex:ex}; }

  function buildExample(days, type){
    var wd = ({3:[1,3,5],4:[1,2,4,5],5:[1,2,3,4,5]})[days] || [1,3,5];
    var out=[];
    if(type==="fullbody"){
      var FB=[
        ["Full body A",[mkE("Sentadilla o prensa de piernas",3,"8–12",120),mkE("Press de pecho",3,"8–12",90),mkE("Remo (máquina o polea)",3,"8–12",90),mkE("Press de hombros",3,"10–12",90),mkC("Plancha (core)",3,45,"30–45s")]],
        ["Full body B",[mkE("Peso muerto rumano o hip thrust",3,"8–12",120),mkE("Jalón al pecho",3,"8–12",90),mkE("Press inclinado",3,"8–12",90),mkE("Elevaciones laterales",3,"12–15",60),mkE("Curl de bíceps",3,"10–12",60)]],
        ["Full body C",[mkE("Prensa de piernas",3,"10–12",120),mkE("Press de pecho (máquina)",3,"8–12",90),mkE("Remo en máquina",3,"10–12",90),mkE("Extensión de tríceps",3,"10–15",60),mkE("Elevación de gemelos",3,"12–20",60)]],
        ["Full body D",[mkE("Zancadas o sentadilla búlgara",3,"10–12",90),mkE("Fondos o press cerrado",3,"8–12",90),mkE("Remo con mancuerna",3,"10–12",90),mkE("Face pulls",3,"12–20",60),mkC("Abdominales (plancha)",3,45,"30–45s")]],
        ["Full body E",[mkE("Hip thrust",3,"8–12",90),mkE("Dominadas o jalón",3,"6–10",90),mkE("Aperturas (peck deck)",3,"10–15",60),mkE("Curl martillo",3,"10–12",60),mkE("Elevación de gemelos",3,"12–20",60)]],
      ];
      for(var i=0;i<days;i++){ out.push(mkDay(FB[i][0],wd[i],FB[i][1])); }
    } else {
      var tpl;
      if(days===3){
        tpl=[
          ["Empuje (Pecho · Hombros · Tríceps)",[mkE("Press de pecho",4,"6–10",120),mkE("Press inclinado",3,"8–12",90),mkE("Press de hombros",3,"8–12",90),mkE("Elevaciones laterales",3,"12–20",60),mkE("Extensión de tríceps",3,"10–15",60)]],
          ["Tirón (Espalda · Bíceps)",[mkE("Jalón al pecho o dominadas",4,"6–10",120),mkE("Remo sentado en polea",4,"8–12",90),mkE("Remo en máquina",3,"10–12",90),mkE("Face pulls",3,"12–20",60),mkE("Curl de bíceps",3,"8–12",60)]],
          ["Piernas",[mkE("Sentadilla o prensa",4,"6–10",150),mkE("Prensa de piernas",3,"10–15",120),mkE("Extensión de cuádriceps",3,"12–15",75),mkE("Curl femoral",3,"10–15",75),mkE("Elevación de gemelos",4,"12–20",60)]],
        ];
      } else if(days===4){
        tpl=[
          ["Pecho y Tríceps",[mkE("Press de pecho",4,"6–10",120),mkE("Press inclinado",3,"8–12",90),mkE("Aperturas (peck deck)",3,"10–15",60),mkE("Extensión de tríceps en polea",3,"10–15",60),mkE("Fondos o press cerrado",3,"8–12",90)]],
          ["Espalda y Bíceps",[mkE("Jalón al pecho o dominadas",4,"6–10",120),mkE("Remo sentado en polea",4,"8–12",90),mkE("Remo en máquina",3,"10–12",90),mkE("Curl de bíceps",3,"8–12",60),mkE("Curl martillo",3,"10–12",60)]],
          ["Piernas",[mkE("Sentadilla o prensa",4,"6–10",150),mkE("Prensa de piernas",3,"10–15",120),mkE("Extensión de cuádriceps",3,"12–15",75),mkE("Curl femoral",3,"10–15",75),mkE("Elevación de gemelos",4,"12–20",60)]],
          ["Hombros y Core",[mkE("Press de hombros",4,"8–12",90),mkE("Elevaciones laterales",4,"12–20",60),mkE("Elevaciones frontales",3,"12–15",60),mkE("Face pulls",3,"12–20",60),mkC("Plancha (core)",3,45,"30–45s")]],
        ];
      } else {
        tpl=[
          ["Pecho",[mkE("Press de pecho",4,"6–10",120),mkE("Press inclinado",3,"8–12",90),mkE("Aperturas (peck deck)",3,"10–15",60),mkE("Fondos o press cerrado",3,"8–12",90)]],
          ["Espalda",[mkE("Jalón al pecho o dominadas",4,"6–10",120),mkE("Remo sentado en polea",4,"8–12",90),mkE("Remo en máquina",3,"10–12",90),mkE("Face pulls",3,"12–20",60)]],
          ["Piernas",[mkE("Sentadilla o prensa",4,"6–10",150),mkE("Prensa de piernas",3,"10–15",120),mkE("Extensión de cuádriceps",3,"12–15",75),mkE("Curl femoral",3,"10–15",75),mkE("Elevación de gemelos",4,"12–20",60)]],
          ["Hombros",[mkE("Press de hombros",4,"8–12",90),mkE("Elevaciones laterales",4,"12–20",60),mkE("Elevaciones frontales",3,"12–15",60),mkE("Face pulls",3,"12–20",60)]],
          ["Brazos",[mkE("Curl de bíceps",3,"8–12",60),mkE("Curl martillo",3,"10–12",60),mkE("Extensión de tríceps en polea",3,"10–15",60),mkE("Press cerrado o fondos",3,"8–12",90)]],
        ];
      }
      for(var j=0;j<tpl.length;j++){ out.push(mkDay(tpl[j][0],wd[j],tpl[j][1])); }
    }
    return out;
  }

  function exampleDesc(days,type){
    if(type==="fullbody") return days+" días de cuerpo completo: cada día entrenás todo el cuerpo. Ideal para empezar.";
    if(days===3) return "3 días (split): Empuje / Tirón / Piernas.";
    if(days===4) return "4 días (split): Pecho+Tríceps / Espalda+Bíceps / Piernas / Hombros+Core.";
    return "5 días (split): un grupo por día — Pecho / Espalda / Piernas / Hombros / Brazos.";
  }

  // ---------- almacenamiento ----------
  var APPKEY="mi-rutina-app";
  var app=loadApp();
  function loadApp(){ try{ var s=JSON.parse(localStorage.getItem(APPKEY)); if(s&&s.profiles) return s; }catch(e){}
    return { profiles:[], current:null, theme:null }; }
  function saveApp(){ try{ localStorage.setItem(APPKEY,JSON.stringify(app)); }catch(e){} }
  function dataKey(pid){ return "mi-rutina-data-"+pid; }
  function loadData(pid){ try{ var s=JSON.parse(localStorage.getItem(dataKey(pid))); if(s&&s.plan) return s; }catch(e){}
    return { firstWeek:CUR, plan:[], weeks:{} }; }
  var data=null;
  function saveData(){ if(app.current) try{ localStorage.setItem(dataKey(app.current),JSON.stringify(data)); }catch(e){} }

  function currentProfile(){ return app.profiles.filter(function(p){return p.id===app.current;})[0]||null; }
  function switchProfile(pid){ app.current=pid; saveApp(); data=loadData(pid); recalcWeek(); render(); renderProfileBar(); }
  function createProfile(name){
    var p={id:genId("p"),name:name.trim()||"Perfil"}; app.profiles.push(p); app.current=p.id; saveApp();
    data=loadData(p.id); saveData(); recalcWeek();
  }

  var weekNumber=1;
  function recalcWeek(){ weekNumber=Math.round((new Date(CUR)-new Date(data.firstWeek))/(7*864e5))+1; if(weekNumber<1)weekNumber=1; }

  // ---------- entradas de registro ----------
  function entry(exId, sets){
    if(!data.weeks[CUR]) data.weeks[CUR]={};
    var e=data.weeks[CUR][exId];
    if(!e){ e={sets:[],note:""}; data.weeks[CUR][exId]=e; }
    while(e.sets.length<sets) e.sets.push({w:"",r:"",done:false});
    if(e.note==null) e.note="";
    return e;
  }
  function prevEntry(exId){ var w=data.weeks[PREV]; return (w&&w[exId])||null; }
  function prevSummary(exId){ var e=prevEntry(exId); if(!e)return "—"; var p=[]; e.sets.forEach(function(s){ if(s.done||s.w||s.r) p.push(s.w?(s.w+"×"+(s.r||"?")):((s.r||"?")+" reps")); }); return p.length?p.join(" · "):"—"; }
  function prevNote(exId){ var e=prevEntry(exId); return (e&&e.note)||""; }

  // ---------- tema ----------
  function initTheme(){ if(app.theme) document.documentElement.setAttribute("data-theme",app.theme); }
  $("theme").onclick=function(){ var c=document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"); app.theme=c==="dark"?"light":"dark"; document.documentElement.setAttribute("data-theme",app.theme); saveApp(); };

  // ---------- barra de perfil ----------
  function renderProfileBar(){ var p=currentProfile(); $("profname").textContent=p?p.name:"—"; }
  $("profbtn").onclick=function(){ openProfileModal(); };

  function openProfileModal(){
    var rows=app.profiles.map(function(p){
      var ini=(p.name[0]||"?").toUpperCase();
      return '<div class="profrow'+(p.id===app.current?" cur":"")+'" data-pid="'+p.id+'">'
        +'<div class="av">'+esc(ini)+'</div><div style="flex:1"><b>'+esc(p.name)+'</b></div>'
        +(p.id===app.current?'<span class="muted" style="font-size:12px">actual</span>':'')
        +'<button class="minibtn del" data-del="'+p.id+'" title="Borrar">🗑</button></div>';
    }).join("");
    openModal("Perfiles", rows
      +'<button class="addbtn" id="np" style="margin-top:12px">➕ Crear perfil nuevo</button>'
      +'<p class="muted" style="font-size:12px;margin-top:12px">Cada perfil guarda su propia rutina y datos en este dispositivo.</p>',
      function(box){
        box.querySelectorAll(".profrow").forEach(function(r){
          r.onclick=function(e){ if(e.target.closest("[data-del]"))return; switchProfile(r.getAttribute("data-pid")); closeModal(); };
        });
        box.querySelectorAll("[data-del]").forEach(function(b){
          b.onclick=function(e){ e.stopPropagation(); var pid=b.getAttribute("data-del");
            if(app.profiles.length<=1){ alert("Tiene que quedar al menos un perfil."); return; }
            if(!confirm("¿Borrar este perfil y todos sus datos?")) return;
            app.profiles=app.profiles.filter(function(p){return p.id!==pid;});
            try{ localStorage.removeItem(dataKey(pid)); }catch(e2){}
            if(app.current===pid){ app.current=app.profiles[0].id; data=loadData(app.current); recalcWeek(); }
            saveApp(); openProfileModal(); render(); renderProfileBar();
          };
        });
        box.querySelector("#np").onclick=function(){ promptNewProfile(); };
      });
  }
  function promptNewProfile(){
    openModal("Crear perfil",
      '<label class="flabel">Tu nombre</label><input class="field" id="pn" placeholder="Ej: Franco" autocomplete="off">'
      +'<button class="btn primary" id="pcreate" style="width:100%;margin-top:16px">Crear</button>',
      function(box){
        var inp=box.querySelector("#pn"); inp.focus();
        box.querySelector("#pcreate").onclick=function(){ if(!inp.value.trim()){ inp.focus(); return; } createProfile(inp.value); closeModal(); editMode=false; render(); renderProfileBar(); };
      });
  }

  // ---------- modal genérico ----------
  function openModal(title, html, onMount){ $("modal-title").textContent=title; $("modal-body").innerHTML=html; $("overlay").classList.add("show"); if(onMount) onMount($("modal-body")); }
  function closeModal(){ $("overlay").classList.remove("show"); }
  function overlayClose(e){ if(e.target===$("overlay")) closeModal(); }
  $("overlay").onclick=overlayClose;

  // ---------- render principal ----------
  var editMode=false;
  function render(){
    var mon=new Date(CUR+"T00:00:00"), sun=new Date(addDays(CUR,6)+"T00:00:00");
    var f=function(x){return x.toLocaleDateString("es-AR",{day:"numeric",month:"short"});};
    $("weeklabel").textContent="Semana del "+f(mon)+" al "+f(sun);
    $("wknum").textContent="Semana "+weekNumber;
    $("edtools").style.display=editMode?"flex":"none";
    $("editbtn").textContent=editMode?"✓ Terminar edición":"✏️ Editar rutina";

    var wrap=$("days"); wrap.innerHTML="";
    if(data.plan.length===0){
      wrap.innerHTML='<div class="empty"><div style="font-size:34px">🏗️</div>'
        +'<b style="font-size:16px;display:block;margin-top:8px">Tu rutina está vacía</b>'
        +'<p class="muted" style="font-size:13px;margin:6px 0 0">Creá tu primer día y agregá tus ejercicios.</p>'
        +'<button class="btn primary" id="ed1" style="width:100%;margin-top:16px">➕ Crear mi primer día</button>'
        +'<button class="btn" id="ed2" style="width:100%;margin-top:8px">Cargar rutina de ejemplo</button></div>';
      wrap.querySelector("#ed1").onclick=function(){ dayForm(); };
      wrap.querySelector("#ed2").onclick=function(){ exampleForm(); };
      updateCounts();
      return;
    }
    var todayWd=new Date().getDay(), letter=65;
    data.plan.forEach(function(day){
      var badge=day.warm?"🔥":String.fromCharCode(letter++);
      var isToday=!day.warm && day.weekday===todayWd;
      var d=document.createElement("details");
      d.className="day"+(day.warm?" warm":""); if(isToday||editMode) d.open=true;
      d.innerHTML='<summary><div class="badge">'+badge+'</div>'
        +'<div class="grow"><div class="ttl">'+esc(day.title)+'</div>'
        +'<div class="sub muted">'+(isToday?'<span class="today">HOY</span> · ':'')+'<span class="mono" id="cnt-'+day.id+'"></span></div></div>'
        +'<div class="chev">▾</div></summary><div class="exlist" id="ex-'+day.id+'"></div>';
      wrap.appendChild(d);
      var list=d.querySelector("#ex-"+day.id);
      if(editMode){ buildEditList(list, day); }
      else { day.ex.forEach(function(ex){ list.appendChild(logRow(day, ex)); }); }
    });
    updateCounts();
  }

  // ----- fila en modo REGISTRO -----
  function logRow(day, ex){
    var e=entry(ex.id, ex.sets);
    var sub=ex.log?(ex.sets+" × "+ex.reps):(ex.sets>1?(ex.sets+" × "+ex.tgt):ex.tgt);
    var pn=prevNote(ex.id);
    var row=document.createElement("div"); row.className="ex";
    row.innerHTML='<div class="exhead"><button class="dot" type="button" aria-label="Marcar"></button>'
      +'<div class="nm"><b>'+esc(ex.n)+'</b><small>'+esc(sub)+'</small>'
      +(pn?'<span class="notehint" title="'+esc(pn)+'">📝 '+esc(pn)+'</span>':'')+'</div>'
      +'<span class="ser" id="ser-'+ex.id+'"></span><span class="exchev">▾</span></div><div class="panel"></div>';
    var head=row.querySelector(".exhead"), dot=row.querySelector(".dot"), panel=row.querySelector(".panel");
    var pe=ex.log?prevEntry(ex.id):null, buildRows=ex.log||ex.sets>1;
    if(pn) panel.insertAdjacentHTML("beforeend",'<div class="prevnote">📝 <b>La semana pasada anotaste:</b> '+esc(pn)+'</div>');
    if(ex.log) panel.insertAdjacentHTML("beforeend",'<div class="prev">Cargas semana pasada: <b>'+prevSummary(ex.id)+'</b></div>');
    if(buildRows){ for(var i=0;i<ex.sets;i++){ (function(i){
      var sr=document.createElement("div"); sr.className="setrow"+(ex.log?"":" chk1")+(e.sets[i].done?" on":"");
      if(ex.log){ var pw=(pe&&pe.sets[i]&&pe.sets[i].w)||"", pr=(pe&&pe.sets[i]&&pe.sets[i].r)||"";
        sr.innerHTML='<span class="sn">'+(i+1)+'</span><span class="fin"><input inputmode="decimal" placeholder="'+esc(pw||"kg")+'" value="'+esc(e.sets[i].w||"")+'"><em>kg</em></span>'
          +'<span class="fin"><input inputmode="numeric" placeholder="'+esc(pr||"reps")+'" value="'+esc(e.sets[i].r||"")+'"><em>reps</em></span><button class="tick">✓</button>';
        var ins=sr.querySelectorAll("input"); ins[0].oninput=function(){e.sets[i].w=ins[0].value;saveData();}; ins[1].oninput=function(){e.sets[i].r=ins[1].value;saveData();};
      } else { sr.innerHTML='<span class="sn">'+(i+1)+'</span><span class="tgt">'+esc(ex.tgt||"")+'</span><button class="tick">✓</button>'; }
      sr.querySelector(".tick").onclick=function(){ var was=e.sets[i].done; e.sets[i].done=!was; saveData(); sr.classList.toggle("on",e.sets[i].done); if(e.sets[i].done&&!was&&ex.rest>0)startRest(ex.rest); updateCounts(); };
      panel.appendChild(sr);
    })(i); } }
    var nw=document.createElement("div");
    nw.innerHTML='<label class="notelbl">Nota para la próxima semana</label><textarea class="noteinput" placeholder="Ej: subir peso · cambié este ejercicio por X · molestó el hombro"></textarea>';
    var ta=nw.querySelector("textarea"); ta.value=e.note||""; ta.oninput=function(){ e.note=ta.value; saveData(); };
    panel.appendChild(nw);
    head.onclick=function(ev){ if(ev.target===dot)return; row.classList.toggle("open"); };
    dot.onclick=function(ev){ ev.stopPropagation(); var all=e.sets.length>0&&e.sets.every(function(s){return s.done;});
      e.sets.forEach(function(s){s.done=!all;}); saveData();
      panel.querySelectorAll(".setrow").forEach(function(sr,idx){ if(e.sets[idx]) sr.classList.toggle("on",e.sets[idx].done); });
      if(!all&&ex.rest>0)startRest(ex.rest); updateCounts(); };
    return row;
  }

  // ----- lista en modo EDICIÓN -----
  function buildEditList(list, day){
    day.ex.forEach(function(ex){
      var r=document.createElement("div"); r.className="edrow";
      var sub=ex.log?(ex.sets+" × "+ex.reps+" · desc "+ex.rest+"s"):(ex.sets+" × "+(ex.tgt||"marcar"));
      r.innerHTML='<div class="nm"><b>'+esc(ex.n)+'</b><small>'+esc(sub)+'</small></div>'
        +'<button class="minibtn" title="Editar">✏️</button><button class="minibtn del" title="Borrar">🗑</button>';
      var btns=r.querySelectorAll("button");
      btns[0].onclick=function(){ exerciseForm(day, ex); };
      btns[1].onclick=function(){ if(confirm("¿Borrar \""+ex.n+"\"?")){ day.ex=day.ex.filter(function(x){return x.id!==ex.id;}); saveData(); render(); } };
      list.appendChild(r);
    });
    var add=document.createElement("button"); add.className="addbtn"; add.textContent="➕ Agregar ejercicio";
    add.onclick=function(){ exerciseForm(day, null); };
    list.appendChild(add);
    var danger=document.createElement("button"); danger.className="addbtn"; danger.style.color="var(--danger)"; danger.style.marginTop="8px"; danger.textContent="🗑 Borrar este día";
    danger.onclick=function(){ if(confirm("¿Borrar el día \""+day.title+"\"?")){ data.plan=data.plan.filter(function(d){return d.id!==day.id;}); saveData(); render(); } };
    list.appendChild(danger);
  }

  // ----- formulario de ejercicio -----
  function exerciseForm(day, ex){
    var isNew=!ex; var log=ex?!!ex.log:true;
    openModal(isNew?"Nuevo ejercicio":"Editar ejercicio",
      '<label class="flabel">Nombre</label><input class="field" id="fn" value="'+esc(ex?ex.n:"")+'" placeholder="Ej: Press de banca">'
      +'<label class="flabel">Tipo</label><div class="seg" id="ftype"><button data-v="1">Peso y reps</button><button data-v="0">Solo marcar</button></div>'
      +'<label class="flabel">Series</label><input class="field" id="fsets" inputmode="numeric" value="'+(ex?ex.sets:3)+'">'
      +'<div id="flog"><label class="flabel">Reps (rango)</label><input class="field" id="freps" value="'+esc(ex?ex.reps:"8–12")+'" placeholder="8–12"></div>'
      +'<div id="ftgt" style="display:none"><label class="flabel">Objetivo (ej: 30s, 10 min)</label><input class="field" id="ftgtv" value="'+esc(ex?ex.tgt:"")+'" placeholder="30–45s"></div>'
      +'<label class="flabel">Descanso (segundos)</label><input class="field" id="frest" inputmode="numeric" value="'+(ex?ex.rest:90)+'">'
      +'<button class="btn primary" id="fsave" style="width:100%;margin-top:16px">'+(isNew?"Agregar":"Guardar")+'</button>',
      function(box){
        function setType(v){ log=v; box.querySelectorAll("#ftype button").forEach(function(b){ b.classList.toggle("on", (b.getAttribute("data-v")==="1")===v); });
          box.querySelector("#flog").style.display=v?"block":"none"; box.querySelector("#ftgt").style.display=v?"none":"block"; }
        setType(log);
        box.querySelectorAll("#ftype button").forEach(function(b){ b.onclick=function(){ setType(b.getAttribute("data-v")==="1"); }; });
        box.querySelector("#fsave").onclick=function(){
          var name=box.querySelector("#fn").value.trim(); if(!name){ box.querySelector("#fn").focus(); return; }
          var sets=Math.max(1,parseInt(box.querySelector("#fsets").value,10)||1);
          var rest=Math.max(0,parseInt(box.querySelector("#frest").value,10)||0);
          var reps=box.querySelector("#freps").value.trim(), tgt=box.querySelector("#ftgtv").value.trim();
          if(isNew){ day.ex.push({id:genId("ex"),n:name,log:log,sets:sets,reps:log?reps:"",rest:rest,tgt:log?"":tgt}); }
          else { ex.n=name; ex.log=log; ex.sets=sets; ex.rest=rest; ex.reps=log?reps:""; ex.tgt=log?"":tgt; }
          saveData(); closeModal(); render();
        };
      });
  }

  // ----- formulario de día -----
  function dayForm(){
    var days=["Sin día fijo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
    openModal("Nuevo día",
      '<label class="flabel">Nombre del día</label><input class="field" id="dn" placeholder="Ej: Piernas / Full body">'
      +'<label class="flabel">Día de la semana (opcional)</label><select class="field" id="dw">'
      +days.map(function(x,i){return '<option value="'+(i===0?"":(i%7))+'">'+x+'</option>';}).join("")+'</select>'
      +'<button class="btn primary" id="dsave" style="width:100%;margin-top:16px">Agregar día</button>',
      function(box){
        box.querySelector("#dn").focus();
        box.querySelector("#dsave").onclick=function(){
          var name=box.querySelector("#dn").value.trim(); if(!name){ box.querySelector("#dn").focus(); return; }
          var wv=box.querySelector("#dw").value; var wd=wv===""?null:parseInt(wv,10);
          data.plan.push({id:genId("d"),title:name,weekday:wd,ex:[]}); saveData(); closeModal(); render();
        };
      });
  }

  // ----- elegir rutina de ejemplo (días + tipo) -----
  function exampleForm(){
    var days=3, type="fullbody";
    openModal("Rutina de ejemplo",
      '<label class="flabel">¿Cuántos días por semana?</label>'
      +'<div class="seg" id="exd"><button data-v="3">3 días</button><button data-v="4">4 días</button><button data-v="5">5 días</button></div>'
      +'<label class="flabel">Tipo</label>'
      +'<div class="seg" id="ext"><button data-v="fullbody">Full body</button><button data-v="split">Por grupo muscular</button></div>'
      +'<p class="muted" id="exdesc" style="font-size:12.5px;margin-top:12px;line-height:1.5"></p>'
      +'<button class="btn primary" id="exload" style="width:100%;margin-top:12px">Cargar esta rutina</button>',
      function(box){
        function refresh(){
          box.querySelectorAll("#exd button").forEach(function(b){ b.classList.toggle("on", parseInt(b.getAttribute("data-v"),10)===days); });
          box.querySelectorAll("#ext button").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-v")===type); });
          box.querySelector("#exdesc").textContent=exampleDesc(days,type);
        }
        box.querySelectorAll("#exd button").forEach(function(b){ b.onclick=function(){ days=parseInt(b.getAttribute("data-v"),10); refresh(); }; });
        box.querySelectorAll("#ext button").forEach(function(b){ b.onclick=function(){ type=b.getAttribute("data-v"); refresh(); }; });
        refresh();
        box.querySelector("#exload").onclick=function(){
          if(data.plan.length && !confirm("Esto reemplaza tu rutina actual por la de ejemplo. ¿Continuar?")) return;
          data.plan=buildExample(days,type); saveData(); closeModal(); editMode=false; render();
        };
      });
  }

  function updateCounts(){
    var tot=0,done=0;
    data.plan.forEach(function(day){
      var gd=0;
      day.ex.forEach(function(ex){ var e=(data.weeks[CUR]||{})[ex.id]; var sd=0; if(e)e.sets.forEach(function(s){if(s.done)sd++;}); var exDone=e&&sd>=ex.sets&&ex.sets>0; if(exDone)gd++;
        var ser=$("ser-"+ex.id); if(ser)ser.textContent=sd+"/"+ex.sets; });
      var cnt=$("cnt-"+day.id); if(cnt)cnt.textContent=gd+"/"+day.ex.length+" ejercicios";
      // marcar filas hechas
      var listEl=$("ex-"+day.id);
      if(listEl && !editMode){ var rows=listEl.querySelectorAll(".ex"); day.ex.forEach(function(ex,idx){ var e=(data.weeks[CUR]||{})[ex.id]; var sd=0; if(e)e.sets.forEach(function(s){if(s.done)sd++;}); var exDone=e&&sd>=ex.sets&&ex.sets>0;
        if(rows[idx]){ rows[idx].classList.toggle("done",exDone); var dt=rows[idx].querySelector(".dot"); if(dt)dt.textContent=exDone?"✓":""; } }); }
      if(!day.warm){ tot+=day.ex.length; done+=gd; }
    });
    $("ov-txt").textContent=done+"/"+tot+" ejercicios";
    $("ov-bar").style.width=(tot?done/tot*100:0)+"%";
  }

  // ---------- timer ----------
  var rt=null,left=0;
  function fmt(s){ var m=Math.floor(s/60); return m+":"+String(s%60).padStart(2,"0"); }
  function startRest(sec){ left=sec; $("rest").classList.add("show"); paint(); clearInterval(rt); rt=setInterval(function(){ left--; if(left<=0){ fin(); return; } paint(); },1000); }
  function paint(){ $("rest-t").textContent=fmt(Math.max(0,left)); }
  function fin(){ clearInterval(rt); rt=null; $("rest-t").textContent="0:00"; if(navigator.vibrate)navigator.vibrate([200,90,200]); beep(); setTimeout(function(){ $("rest").classList.remove("show"); },900); }
  function stop(){ clearInterval(rt); rt=null; $("rest").classList.remove("show"); }
  function beep(){ try{ var C=window.AudioContext||window.webkitAudioContext; if(!C)return; var c=new C(); var o=c.createOscillator(),g=c.createGain(); o.connect(g);g.connect(c.destination); o.frequency.value=880; g.gain.setValueAtTime(.001,c.currentTime); g.gain.exponentialRampToValueAtTime(.25,c.currentTime+.02); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.5); o.start(); o.stop(c.currentTime+.5); }catch(e){} }
  $("rest-minus").onclick=function(){ left=Math.max(1,left-15); paint(); };
  $("rest-plus").onclick=function(){ left+=15; paint(); };
  $("rest-skip").onclick=stop;

  // ---------- acciones ----------
  $("editbtn").onclick=function(){ editMode=!editMode; render(); };
  $("doneedit").onclick=function(){ editMode=false; render(); };
  $("addday").onclick=function(){ dayForm(); };
  $("reset").onclick=function(){ if(confirm("¿Destildar y borrar los registros de ESTA semana?")){ data.weeks[CUR]={}; saveData(); render(); } };

  // ---------- arranque ----------
  initTheme();
  if(!app.current || !currentProfile()){
    // primer uso: pedir nombre
    if(app.profiles.length && app.profiles[0]){ switchProfile(app.profiles[0].id); }
    else {
      openModal("¡Bienvenido/a! 👋",
        '<p class="muted" style="font-size:14px;margin:0 0 12px">Creá tu perfil para empezar. Tus datos se guardan en este dispositivo.</p>'
        +'<label class="flabel">¿Cómo te llamás?</label><input class="field" id="wn" placeholder="Tu nombre" autocomplete="off">'
        +'<button class="btn primary" id="wc" style="width:100%;margin-top:16px">Empezar</button>',
        function(box){ var inp=box.querySelector("#wn"); inp.focus();
          box.querySelector("#wc").onclick=function(){ if(!inp.value.trim()){inp.focus();return;} createProfile(inp.value); closeModal(); $("overlay").onclick=overlayClose; render(); renderProfileBar(); }; });
      // evitar cerrar el welcome tocando afuera (se restaura al crear el perfil)
      $("overlay").onclick=function(){};
    }
  } else {
    data=loadData(app.current); recalcWeek(); render(); renderProfileBar();
  }
})();
</script>
</body>
